<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>Hello Meghalaya 1.0.0</title>

  <link href="https://fonts.googleapis.com/css?family=Fira Sans" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="./appstyle.css" />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #000;
      z-index: 9999999;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div id="splash">
    <video id="video" name="media" preload="auto" playsinline>
      <source id="mp4" src="" type="video/mp4" />
    </video>
  </div>

  <div id="app-root"></div>

  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
  <script src="./player-package/plugin/spinit.js"></script>
  <script src="./webOS-sdk/webOSTV.js"></script>

  <script src="https://www.gstatic.com/firebasejs/7.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.8.0/firebase-analytics.js"></script>

  <script>
    // Firebase initialization

    // Exit application
    window.exitApp = function () {
      window.close();
    };

    // Set video source dynamically based on screen resolution
    var splashStarted = false;
    function setVideoSource() {
      if (splashStarted) return;
      splashStarted = true;

      const width = window.innerWidth;
      const height = window.innerHeight;

      const videoPath =
        width >= 1280 || height >= 720
          ? "./720p-HelloMeghalaya_splash.mp4"
          : "./480p-HelloMeghalaya_splash.mp4";

      const video = document.getElementById("video");
      const source = document.getElementById("mp4");

      if (!video || !source) return;

      video.muted = false;
      video.volume = 1.0;
      source.src = videoPath;
      video.load();

      const playPromise = video.play();

      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(function (error) {
          console.warn("Unmuted splash autoplay failed, attempting muted fallback:", error);
          video.muted = true;
          video.play().catch(function (e) {
            console.warn("Splash video playback failed:", e);
          });

          // For browser testing: unmute immediately on the first user interaction (key or click)
          var unmuteOnGesture = function () {
            if (video && !video.ended) {
              video.muted = false;
              video.volume = 1.0;
            }
            window.removeEventListener("keydown", unmuteOnGesture, true);
            window.removeEventListener("click", unmuteOnGesture, true);
          };
          window.addEventListener("keydown", unmuteOnGesture, { once: true, capture: true });
          window.addEventListener("click", unmuteOnGesture, { once: true, capture: true });
        });
      }

      console.log("Screen dimensions:", width, "x", height);
      console.log("Splash video path:", videoPath);
    }

    document.addEventListener("DOMContentLoaded", function () {

      // Check Dolby Digital Plus support
      const isDDPSupported =
        typeof MediaSource !== "undefined" &&
        typeof MediaSource.isTypeSupported === "function" &&
        MediaSource.isTypeSupported('audio/mp4; codecs="ec-3"');

      localStorage.setItem("is_ddp_supported", isDDPSupported);

      console.log("EC-3 audio support:", isDDPSupported);

      // Configure and play splash video
      setVideoSource();
    });
  </script>
</body>

</html>
